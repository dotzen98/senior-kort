<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seniorer i København - Puljemidler</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>html { visibility: hidden; }</style>
</head>
<body>

  <!-- FILTER PANEL -->
  <div id="filter-panel">
    <div>
      <h1>Seniorer i København</h1>
      <p style="font-size:13px;color:#6c757d;margin-top:4px;">Overblik over bevilgede puljemidler</p>
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
        <a href="admin.html" style="font-size:12px;color:#0d6efd;text-decoration:none;">⚙ Administrer tilskudsmodtagere</a>
        <button onclick="auth.logout()" style="font-size:12px;color:#6c757d;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;">Log ud</button>
      </div>
    </div>

    <div class="filter-section">
      <h3>Søg</h3>
      <input type="text" id="search-box" placeholder="Søg efter tilskudsmodtager..." />
    </div>

    <div class="filter-section">
      <div class="filter-head">
        <h3>Puljer</h3>
        <span class="select-links">
          <button type="button" data-target="program-filters" data-check="true">Alle</button>
          <button type="button" data-target="program-filters" data-check="false">Ingen</button>
        </span>
      </div>
      <div id="program-filters" class="checkbox-group"></div>
    </div>

    <div class="filter-section">
      <div class="filter-head">
        <h3>År</h3>
        <span class="select-links">
          <button type="button" data-target="year-filters" data-check="true">Alle</button>
          <button type="button" data-target="year-filters" data-check="false">Ingen</button>
        </span>
      </div>
      <div id="year-filters" class="checkbox-group"></div>
    </div>

    <div class="filter-section">
      <h3>Beløb (DKK)</h3>
      <div class="range-row">
        <input type="number" id="min-amount" placeholder="Min" min="0" step="1000" />
        <span>—</span>
        <input type="number" id="max-amount" placeholder="Max" min="0" step="1000" />
      </div>
    </div>

    <button id="reset-btn">Nulstil filtre</button>
    <div id="stats"></div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- DETAIL PANEL -->
  <div id="detail-panel">
    <div id="detail-header">
      <div id="detail-name"></div>
      <button id="close-detail">&times;</button>
    </div>
    <div id="detail-body">
      <div id="detail-total"></div>
      <div id="detail-total-label">Samlet bevilling</div>
      <a id="detail-admin-link" href="admin.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Administrer tilskudsmodtager
      </a>
      <table id="detail-table">
        <thead><tr><th>Pulje</th><th>Beløb</th></tr></thead>
        <tbody id="detail-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- LEGEND -->
  <div id="legend">
    <h4>Samlet bevilling</h4>
    <div id="legend-items"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
